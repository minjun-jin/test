plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.github.ben-manes.versions' version '0.61.0'
	id 'maven-publish'
	id 'jacoco'
}

group = 'com.jpmc.kcg'
version = '1.0.0-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
//	toolchain {
//		languageVersion = JavaLanguageVersion.of(17)
//	}
	sourceCompatibility = '17'
	targetCompatibility = '17'
}

configurations {
	all {
		resolutionStrategy {
			cacheChangingModulesFor 0, 'seconds'
			cacheDynamicVersionsFor 0, 'seconds'
		}
	}
	compileOnly {
		extendsFrom annotationProcessor
	}
	generateMyBatis
}

publishing {
	publications {
		jar(MavenPublication) {
			artifact tasks.named('bootJar')
//			artifact tasks.named('jar')
		}
	}
	repositories {
		maven {
			url = 'https://git.bwg.co.kr/gitlab/api/v4/projects/1410/packages/maven'
			credentials(HttpHeaderCredentials) {
				name = 'Deploy-Token'
				value = ''
			}
			authentication {
				header(HttpHeaderAuthentication)
			}
		}
	}
}

repositories {
	mavenCentral()
	maven {
		url = 'https://git.bwg.co.kr/gitlab/api/v4/groups/2648/-/packages/maven'
		name = 'GitLab'
		credentials(HttpHeaderCredentials) {
			name = 'Deploy-Token'
			value = ''
		}
		authentication {
			header(HttpHeaderAuthentication)
		}
	}
}

dependencies {
	modules {
		module('com.vaadin.external.google:android-json') {
			replacedBy('org.json:json')
		}
		module('com.zaxxer:HikariCP-java7') {
			replacedBy('com.zaxxer:HikariCP')
		}
		module('commons-logging:commons-logging') {
			replacedBy('org.springframework:spring-jcl')
		}
		module('org.slf4j:slf4j-log4j12') {
			replacedBy('org.slf4j:slf4j-api')
		}
	}
	implementation 'com.jpmc.kcg:kcg_frw:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_com:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_ars:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_ati:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_cms:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_ent:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_gro:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_hof:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_ift:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_rpr:1.+:plain'
	implementation 'com.jpmc.kcg:kcg_jpmc_module:+'
	implementation platform('net.javacrumbs.shedlock:shedlock-bom:7.9.0')
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template'
	implementation 'net.javacrumbs.shedlock:shedlock-spring'
	implementation platform('org.ow2.asm:asm-bom:9.10.1')
	implementation 'com.github.jknack:handlebars:4.5.4'
	implementation platform('org.bouncycastle:bc-jdk18on-bom:1.85.2')
//	implementation 'org.bouncycastle:bcpkix-jdk18on'
//	implementation 'org.bouncycastle:bcprov-jdk18on'
//	implementation 'org.bouncycastle:bcutil-jdk18on'
	implementation 'org.json:json:20260814'
	implementation 'com.ibm.mq:com.ibm.mq.jakarta.client:10.0.0.0'
	implementation 'com.ibm.mq:mq-jms-spring-boot-starter:4.1.0'
	implementation 'commons-codec:commons-codec:1.22.1'
	implementation 'commons-io:commons-io:2.22.0'
	implementation 'org.apache.commons:commons-collections4:4.6.0'
	implementation 'org.apache.commons:commons-compress:1.28.0'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.apache.commons:commons-lang3:3.20.0'
	implementation 'org.apache.commons:commons-text:1.15.0'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	implementation 'org.quartz-scheduler:quartz:2.5.2'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis:mybatis:3.5.19'
	implementation 'org.mybatis:mybatis-spring:4.1.0'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation 'org.mapstruct.extensions.spring:mapstruct-spring-annotations:2.0.0'
	implementation platform('io.jsonwebtoken:jjwt-bom:0.13.0')
	implementation 'io.jsonwebtoken:jjwt-api'
	implementation 'io.jsonwebtoken:jjwt-impl'
	implementation 'io.jsonwebtoken:jjwt-jackson'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.4'
//	compileOnly 'org.mybatis.generator:mybatis-generator-core:2.0.0'
	compileOnly 'org.projectlombok:lombok:1.18.48'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17:23.26.3.0.0'
	runtimeOnly 'com.oracle.database.nls:orai18n:23.26.3.0.0'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.mapstruct.extensions.spring:mapstruct-spring-extensions:2.0.0'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-aspectj-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-quartz-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
	testImplementation 'org.mapstruct.extensions.spring:mapstruct-spring-test-extensions:2.0.0'
	testCompileOnly 'org.projectlombok:lombok:1.18.48'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testAnnotationProcessor 'org.mapstruct.extensions.spring:mapstruct-spring-extensions:2.0.0'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
	testAnnotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	generateMyBatis 'com.jpmc.kcg:kcg_frw:1.+:plain'
	generateMyBatis 'org.mybatis.generator:mybatis-generator-core:2.0.0'
	generateMyBatis 'com.oracle.database.jdbc:ojdbc17:23.26.3.0.0'
	generateMyBatis 'com.oracle.database.nls:orai18n:23.26.3.0.0'
}

task generateMyBatis(type: JavaExec) {
	group = 'mybatis'
	classpath = configurations.generateMyBatis
//	classpath = configurations.generateMyBatis + sourceSets.main.runtimeClasspath
	mainClass = 'org.mybatis.generator.api.ShellRunner'
	args = ['-configfile', "${projectDir}/generatorConfig.xml", '-overwrite']
}

tasks.named('test') {
	useJUnitPlatform()
//	dryRun = true
	ignoreFailures = true
}

jacoco {
	toolVersion = '0.8.15'
}

jacocoTestReport {
	dependsOn('test')
}

sourceSets {
	main {
		java {
			srcDir 'src-gen'
		}
	}
}

compileJava {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-parameters'
	options.compilerArgs << '-Amapstruct.suppressGeneratorTimestamp=true'
	options.compilerArgs << '-Amapstruct.suppressGeneratorVersionInfoComment=true'
	options.compilerArgs << '-Amapstruct.verbose=true'
	options.compilerArgs << '-Amapstruct.unmappedTargetPolicy=ERROR'
//	options.compilerArgs << '-Amapstruct.unmappedSourcePolicy=ERROR'
//	options.generatedSourceOutputDirectory = file 'src-gen'
}

javadoc {
	options.encoding = 'UTF-8';
}
